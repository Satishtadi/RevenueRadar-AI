# Render blueprint — deploys API + web app for free.
# Setup: Render Dashboard -> New -> Blueprint -> pick this repo.
# Fields marked sync:false are prompted during setup.

services:
  # --- Spring Boot backend ---
  - type: web
    name: revenueradar-api
    runtime: java
    rootDir: backend
    plan: free
    buildCommand: mvn -DskipTests clean package
    startCommand: java -Xmx350m -Xss256k -XX:+UseContainerSupport -jar target/*.jar --server.port=$PORT
    healthCheckPath: /actuator/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        # JDBC format, e.g. jdbc:postgresql://ep-xxx.aws.neon.tech/neondb?sslmode=require
        sync: false
      - key: DATABASE_USERNAME
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      - key: JWT_SECRET
        # Long random string (32+ chars)
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        # Your frontend URL, e.g. https://revenueradar-web.onrender.com
        sync: false
      - key: APP_ENV
        value: production
      - key: AI_PROVIDER
        value: mock

  # --- React frontend (static) ---
  - type: static
    name: revenueradar-web
    rootDir: frontend
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    autoDeploy: true
    envVars:
      - key: VITE_API_BASE_URL
        # Your API URL + /api/v1, e.g. https://revenueradar-api.onrender.com/api/v1
        sync: false
