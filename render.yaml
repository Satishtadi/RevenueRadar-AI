# Render blueprint — API (Docker) + web (static), both on the free plan.
# Render has no native Java runtime, so the Spring Boot API runs in Docker.
# Paths are relative to each service's rootDir.
# Fields marked sync:false are prompted during setup.

services:
  # --- Spring Boot backend ---
  - type: web
    name: revenueradar-api
    runtime: docker
    rootDir: backend
    dockerfilePath: Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: DATABASE_URL
        # JDBC format: jdbc:postgresql://<neon-host>/neondb?sslmode=require
        sync: false
      - key: DATABASE_USERNAME
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      - key: JWT_SECRET
        # 32+ random characters
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        # Frontend origin, e.g. https://revenueradar-web.onrender.com
        sync: false
      - key: APP_ENV
        value: production
      - key: AI_PROVIDER
        value: mock

  # --- React frontend (static site) ---
  - type: web
    name: revenueradar-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Injected automatically by Render: your API's real public hostname
      # (no manual URL copying needed, immune to subdomain collisions)
      - key: VITE_API_ORIGIN
        fromService:
          name: revenueradar-api
          type: web
          envVarKey: RENDER_EXTERNAL_HOSTNAME
