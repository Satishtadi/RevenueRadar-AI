spring:
  application:
    name: revenueradar-backend
  profiles:
    default: local
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/revenueradar}
    username: ${DATABASE_USERNAME:revenueradar}
    password: ${DATABASE_PASSWORD:revenueradar_dev}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 5000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  mvc:
    problemdetails:
      enabled: false

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
  forward-headers-strategy: framework
  servlet:
    context-path: /

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
      probes:
        enabled: always
      group:
        readiness:
          include: readinessState,db
        liveness:
          include: livenessState
  health:
    db:
      enabled: true

app:
  env: ${APP_ENV:local}
  api-base-path: /api/v1
  # Public web origin used to build password-reset links; Render injects the
  # live hostname (scheme-less values are upgraded to https).
  frontend-base-url: ${APP_FRONTEND_BASE_URL:http://localhost:5173}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4174}
  security:
    jwt:
      secret: ${JWT_SECRET:local-development-only-secret-change-me-0123456789abcdef0123456789abcdef}
      access-token-minutes: ${JWT_ACCESS_MINUTES:15}
      refresh-token-days: ${JWT_REFRESH_DAYS:14}
  ai:
    provider: ${AI_PROVIDER:mock}
  pagination:
    default-page-size: 20
    max-page-size: 100

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{requestId}] [%X{orgId:-}] [%X{userId:-}] %logger{40} - %msg%n"
  level:
    root: INFO
    com.revenueradar: INFO
    org.hibernate.SQL: WARN
